[project]
name = "tarmac"
version = "0.1.0"
description = "A panel for the Claude Code sessions that are waiting on you."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
    "textual>=8.2.8",
]

[project.scripts]
tarmac = "tarmac.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tarmac"]
# the hooks have to travel inside the wheel: `tarmac hook install` from the
# installed binary looked for ../hooks/ and died with FileNotFoundError, so only
# a repo checkout could ever install (or update) a hook.
force-include = { "hooks/stop-next-step.sh" = "tarmac/hooks/stop-next-step.sh", "hooks/notification-needs-you.sh" = "tarmac/hooks/notification-needs-you.sh" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
